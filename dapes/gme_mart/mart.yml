mart:
  name: gme-mart
  db_name: gme_db
  prefix: gme
  grain: per-contract-per-day
  version: "3.1"

providers:
  primary: cboe
  reconciliation: openbb
  fallback: yfinance
  auth_required: false

schedule:
  cron: "45 20 * * 1-5"
  timezone: America/New_York
  skip_holidays: true

pipeline:
  steps: [seed, run, test]
  fail_fast: true
  timeout_minutes: 10

dqc:
  control_catalog: required
  scorecard_artifact: dqc_scorecard.json
  reconciliation:
    - metric: max_pain
      source: swaggystocks
      tolerance: 0.05
      severity: warn
    - metric: pc_ratio
      source: barchart
      tolerance: 0.02
      severity: warn
    - metric: net_gex
      source: openbb
      tolerance: 0.15
      severity: warn

dimensions:
  conformed:
    - dim_date
  local:
    - dim_ticker
