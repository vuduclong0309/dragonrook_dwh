version: 2

models:
  - name: gme_dim_date
    description: "Trading calendar dimension with holidays + macro events. Role-playing: use as trade_date or expiry_date FK. Generated from date spine + holiday/event seeds."
    columns:
      - name: date_key
        description: "Calendar date (PK). Range: 2025-01-01 to 2027-12-31."
        tests: [not_null, unique]
      - name: is_trading_day
        description: "NYSE open? False on weekends + holidays (except early close days)."
      - name: has_fomc
        description: "FOMC decision on this date"
      - name: has_earnings
        description: "GME earnings report on this date"

  - name: gme_ods_cboe_options_chain
    description: "Raw CBOE delayed options chain ingested via MotherDuck httpfs. Append-only incremental."
    columns:
      - name: pull_date
        description: "Snapshot date (trading day)"
        tests:
          - not_null
      - name: option_symbol
        description: "OCC option symbol (e.g. GME260605C00020000). 18-char standard, 19-char = GME1 adjusted (filtered in DWD)."
        tests:
          - not_null
      - name: expiry
        description: "Parsed expiry date from OCC symbol. NULL for non-standard (LENGTH != 18)."
      - name: strike
        description: "Parsed strike price from OCC symbol (last 8 digits / 1000)."
      - name: option_type
        description: "Parsed as 'call' or 'put' from OCC symbol position 10."
      - name: gamma
        description: "Option gamma — REAL from CBOE (not BS-calculated). [REAL_API]"
      - name: delta
        description: "Option delta from CBOE. [REAL_API]"
      - name: iv
        description: "Implied volatility from CBOE. [REAL_API]"
      - name: underlying_close
        description: "GME close price at time of CBOE snapshot."
        tests:
          - not_null

  - name: gme_dwd_option_contract_di
    description: "Cleaned daily option contract facts. Grain: one row per (pull_date, ticker, expiry, strike, option_type). Filters: OI > 0, non-weekly (DTE >= 7), valid OCC parse."
    columns:
      - name: pull_date
        tests:
          - not_null
      - name: ticker
        tests:
          - not_null
      - name: expiry
        tests:
          - not_null
      - name: strike
        tests:
          - not_null
      - name: option_type
        tests:
          - not_null
          - accepted_values:
              values: ['call', 'put']
      - name: spot
        tests:
          - not_null
      - name: gex_contribution
        description: "Dollar GEX per 1% spot move = gamma * OI * 100 * spot^2 * 0.01 * sign. Calls=+1, Puts=-1 (dealer convention). [PYTHON_SIM]"
      - name: series_type
        description: "MONTHLY / QUARTERLY / LEAP / WARRANT. Weeklies excluded per operator decision."
        tests:
          - accepted_values:
              values: ['MONTHLY', 'LEAP', 'WARRANT']
      - name: mid_price
        description: "(bid + ask) / 2 if both > 0, else last_trade_price."

  - name: gme_dws_strike_gex_1d
    description: "Net GEX by strike, daily aggregation. Ranked by absolute GEX descending."
    columns:
      - name: pull_date
        tests: [not_null]
      - name: strike
        tests: [not_null]

  - name: gme_dws_warrant_monitor_1d
    description: "Daily warrant position monitoring. All position values from dbt vars (not hardcoded)."
    columns:
      - name: pull_date
        tests: [not_null]
      - name: spot
        tests: [not_null]

  - name: gme_dws_daily_snapshot_1d
    description: "Daily summary for briefing skill. Combines spot, max pain (per-expiry nearest), GEX, P/C ratio, top OI strikes."
    columns:
      - name: pull_date
        tests: [not_null]
      - name: spot
        tests: [not_null]
      - name: max_pain_strike
        tests: [not_null]

  - name: gme_dws_gex_trend_nd
    description: "Rolling 5-day GEX trend with regime classification. Adapted from Shopee order_mart _nd pattern."
    columns:
      - name: gex_regime
        tests:
          - accepted_values:
              values: ['POSITIVE_EXPANDING', 'POSITIVE_STABLE', 'NEGATIVE_EXPANDING', 'NEGATIVE_STABLE', 'NEUTRAL']

  - name: gme_dws_gex_flip_alert_1d
    description: "GEX regime transition alerts. Detects flips (positive/negative), worsening, regime changes."
    columns:
      - name: alert_type
        tests:
          - accepted_values:
              values: ['GEX_FLIP_POSITIVE', 'GEX_FLIP_NEGATIVE', 'NEGATIVE_GEX_WORSENING', 'REGIME_CHANGE', 'NO_ALERT']

  - name: gme_dws_warrant_mtm_1d
    description: "Warrant mark-to-market using matching CBOE $32C call chain. Daily P&L + position Greeks."

  - name: gme_dws_flow_pressure_1d
    description: "Options flow pressure proxy. UNUSUAL_FLOW / POSITION_BUILD / TRADING_CHURN labels. NOTE: proxy only, no institutional identity data."
    columns:
      - name: flow_pressure_label
        tests:
          - accepted_values:
              values: ['UNUSUAL_FLOW', 'POSITION_BUILD', 'TRADING_CHURN', 'NORMAL']

  - name: gme_dws_iv_percentile_1d
    description: "IV percentile rank vs rolling 252-trading-day history. Grain: (pull_date, ticker, expiry_bucket). Phase 1.5 enhancement."
    columns:
      - name: pull_date
        tests:
          - not_null
          - relationships:
              to: ref('gme_dim_date')
              field: date_key
      - name: ticker
        tests: [not_null]
      - name: expiry_bucket
        description: "DTE tenor bucket: NEAR (7-45), MID (46-90), FAR (91+)"
        tests:
          - not_null
          - accepted_values:
              values: ['NEAR', 'MID', 'FAR']
      - name: iv_percentile_252d
        description: "PERCENT_RANK over trailing 252 trading days. NULL when history < 252 days. [THEORETICAL] 252-day window."
      - name: iv_regime
        tests:
          - accepted_values:
              values: ['IV_LOW', 'IV_NORMAL', 'IV_HIGH', 'INSUFFICIENT_DATA']

  - name: gme_dws_unusual_flow_summary_1d
    description: "Pre-aggregated flow signals. Shopee aggregate fact pattern (<1% rows, 100x faster)."
    columns:
      - name: flow_signal
        tests:
          - accepted_values:
              values: ['HIGH_ACTIVITY', 'MODERATE_ACTIVITY', 'NORMAL']

  - name: gme_dws_warrant_lifecycle_td
    description: "Accumulating snapshot tracking warrant from first observation to expiry. Shopee Star-Schema pattern."

  - name: gme_ads_warrant_dashboard
    description: "OBT (One Big Table) for MCP briefing skill. LEFT JOINs all DWS models. Single query = complete briefing."
    columns:
      - name: pull_date
        tests: [not_null]
      - name: spot
        tests: [not_null]
